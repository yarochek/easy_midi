[package]
name = "easy_midi"
version = "0.9.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui_extras = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
midly = "0.5"
tray-icon = "0.14"
winapi = { version = "0.3", features = ["winuser", "minwindef", "windef"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true